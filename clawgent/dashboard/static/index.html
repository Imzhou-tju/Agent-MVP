<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ClawAgent · 多智能体全景可观测看板</title>
<style>
/* ============================================================
   设计令牌：浅色为基准，颜色只承载状态语义
   ============================================================ */
:root {
  --canvas:      #f6f7f9;
  --surface:     #ffffff;
  --surface-alt: #fbfcfd;
  --line:        #e5e7eb;
  --line-strong: #d0d7de;

  --ink:   #1f2328;
  --ink-2: #57606a;
  --ink-3: #848d97;

  --brand:      #2f6feb;
  --brand-wash: #e8f0fe;

  /* 状态色：前景用于文字/图标，底用于标签背景，边用于描边 */
  --ok-fg:#1a7f37;  --ok-bg:#e8f5ec;   --ok-line:#b7e0c4;
  --run-fg:#0969da; --run-bg:#e7f2fe;  --run-line:#b6d7f8;
  --warn-fg:#9a6700;--warn-bg:#fdf3d8; --warn-line:#f0d98a;
  --err-fg:#c0222e; --err-bg:#fdecec;  --err-line:#f5c2c4;
  --idle-fg:#57606a;--idle-bg:#f0f2f4; --idle-line:#dcdfe3;

  --radius: 8px;
  --shadow: 0 1px 2px rgba(31,35,40,.04), 0 1px 1px rgba(31,35,40,.03);
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "PingFang SC", "Microsoft YaHei", sans-serif;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--canvas);
  color: var(--ink);
  font-size: 13px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}

/* 数字统一等宽，便于纵向比对 */
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

/* ============================================================
   顶部栏
   ============================================================ */
.topbar {
  background: var(--surface);
  border-bottom: 1px solid var(--line);
  padding: 0 20px;
  height: 54px;
  display: flex;
  align-items: center;
  gap: 14px;
  position: sticky;
  top: 0;
  z-index: 30;
}
.brand { display: flex; align-items: center; gap: 9px; font-weight: 650; font-size: 14px; }
.brand-mark {
  width: 24px; height: 24px; border-radius: 6px;
  background: var(--brand); color: #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 800; letter-spacing: -.5px;
}
.brand-sub { color: var(--ink-3); font-weight: 400; font-size: 12px; }

.topbar-spacer { margin-left: auto; }
.search-wrap { position: relative; }
.search-wrap input {
  width: 230px; height: 30px;
  padding: 0 10px 0 28px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  font-size: 12.5px; font-family: var(--font); color: var(--ink);
  background: var(--surface);
}
.search-wrap input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px var(--brand-wash); }
.search-wrap .icon { position: absolute; left: 9px; top: 7px; color: var(--ink-3); font-size: 12px; }

.btn {
  height: 30px; padding: 0 11px;
  border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--surface); color: var(--ink-2);
  font-size: 12.5px; font-family: var(--font); font-weight: 500;
  cursor: pointer; display: inline-flex; align-items: center; gap: 5px;
  transition: background .12s, border-color .12s, color .12s;
}
.btn:hover { background: var(--surface-alt); border-color: var(--ink-3); color: var(--ink); }
.btn:focus-visible { outline: 2px solid var(--brand); outline-offset: 1px; }
.btn-primary { background: var(--brand); border-color: var(--brand); color: #fff; }
.btn-primary:hover { background: #2559c4; border-color: #2559c4; color: #fff; }

select.btn { padding-right: 6px; }

.stamp { font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 5px; }
.dot-live {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--ok-fg); display: inline-block;
}

/* ============================================================
   主体骨架
   ============================================================ */
.layout {
  display: grid;
  grid-template-columns: 296px minmax(0, 1fr);
  gap: 16px;
  padding: 16px 20px 40px;
  max-width: 1680px;
  margin: 0 auto;
  align-items: start;
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

/* ---------- 左侧 Run 列表 ---------- */
.side { position: sticky; top: 70px; }
.side-head {
  padding: 11px 13px; border-bottom: 1px solid var(--line);
  display: flex; align-items: center; justify-content: space-between;
}
.side-title { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.count-pill {
  font-size: 11px; color: var(--ink-3); background: var(--idle-bg);
  padding: 1px 7px; border-radius: 10px; font-variant-numeric: tabular-nums;
}

.filters { display: flex; flex-wrap: wrap; gap: 5px; padding: 9px 13px; border-bottom: 1px solid var(--line); }
.chip {
  border: 1px solid var(--line-strong); background: var(--surface);
  color: var(--ink-2); font-size: 11.5px; padding: 2px 9px;
  border-radius: 11px; cursor: pointer; font-family: var(--font);
  transition: all .12s;
}
.chip:hover { border-color: var(--ink-3); }
.chip.on { background: var(--brand); border-color: var(--brand); color: #fff; }

.run-list { max-height: calc(100vh - 210px); overflow-y: auto; }
.run-item {
  padding: 10px 13px; border-bottom: 1px solid var(--line);
  cursor: pointer; border-left: 3px solid transparent;
  transition: background .1s;
}
.run-item:hover { background: var(--surface-alt); }
.run-item.on { background: var(--brand-wash); border-left-color: var(--brand); }
.run-top { display: flex; align-items: center; gap: 7px; margin-bottom: 3px; }
.run-id { font-family: var(--mono); font-size: 11.5px; color: var(--ink-2); font-weight: 600; }
.run-query {
  font-size: 12.5px; color: var(--ink); line-height: 1.45;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden; word-break: break-word;
}
.run-foot {
  margin-top: 5px; display: flex; flex-wrap: wrap; gap: 9px;
  font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.run-foot span { display: inline-flex; align-items: center; gap: 3px; }

/* ---------- 状态标签：颜色 + 符号，不靠颜色单独表意 ---------- */
.tag {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 11px; font-weight: 600; line-height: 1.6;
  padding: 1px 7px; border-radius: 10px; border: 1px solid;
  white-space: nowrap;
}
.tag .gl { font-size: 9px; }
.tag.ok    { color: var(--ok-fg);   background: var(--ok-bg);   border-color: var(--ok-line); }
.tag.run   { color: var(--run-fg);  background: var(--run-bg);  border-color: var(--run-line); }
.tag.warn  { color: var(--warn-fg); background: var(--warn-bg); border-color: var(--warn-line); }
.tag.err   { color: var(--err-fg);  background: var(--err-bg);  border-color: var(--err-line); }
.tag.idle  { color: var(--idle-fg); background: var(--idle-bg); border-color: var(--idle-line); }

/* ============================================================
   详情区
   ============================================================ */
.detail { min-width: 0; }

.run-head { padding: 15px 18px; border-bottom: 1px solid var(--line); }
.run-head-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 7px; }
.run-head h1 {
  font-size: 15.5px; font-weight: 650; line-height: 1.45;
  flex: 1; min-width: 0; word-break: break-word;
}
.run-head-meta {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.run-head-meta b { color: var(--ink-2); font-weight: 600; }
.mono { font-family: var(--mono); font-size: 11.5px; }

/* ---------- KPI 条 ---------- */
.kpi-row {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  border-bottom: 1px solid var(--line);
}
.kpi { padding: 12px 16px; border-right: 1px solid var(--line); }
.kpi:last-child { border-right: none; }
.kpi-label { font-size: 11.5px; color: var(--ink-3); margin-bottom: 2px; }
.kpi-value {
  font-size: 19px; font-weight: 650; line-height: 1.25;
  font-variant-numeric: tabular-nums; letter-spacing: -.2px;
}
.kpi-value .unit { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.kpi-note { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
.kpi.is-ok   .kpi-value { color: var(--ok-fg); }
.kpi.is-warn .kpi-value { color: var(--warn-fg); }
.kpi.is-err  .kpi-value { color: var(--err-fg); }

/* ---------- 阶段流水线 ---------- */
.stages { padding: 14px 18px; border-bottom: 1px solid var(--line); }
.stages-head {
  display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 10px;
}
.stages-title { font-size: 12.5px; font-weight: 650; color: var(--ink-2); }
.stages-hint { font-size: 11px; color: var(--ink-3); }

.stage-track { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.stage {
  flex: 1 1 0; min-width: 108px;
  border: 1px solid var(--line); border-radius: 6px;
  padding: 7px 9px 8px; background: var(--surface-alt);
  position: relative;
}
.stage::before {
  content: ""; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; border-radius: 6px 0 0 6px; background: var(--idle-line);
}
.stage.ok::before   { background: var(--ok-fg); }
.stage.run::before  { background: var(--run-fg); }
.stage.warn::before { background: var(--warn-fg); }
.stage.err::before  { background: var(--err-fg); }
.stage.idle::before { background: var(--idle-line); }
.stage.idle { opacity: .62; }

.stage-name { font-size: 11.5px; font-weight: 650; color: var(--ink); white-space: nowrap; }
.stage-role { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); }
.stage-foot {
  margin-top: 5px; display: flex; align-items: center; justify-content: space-between; gap: 5px;
  font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
}
.stage-foot .tag { flex: none; }

/* ---------- Tab ---------- */
.tabs {
  display: flex; gap: 2px; padding: 0 18px;
  border-bottom: 1px solid var(--line);
}
.tab {
  background: none; border: none; border-bottom: 2px solid transparent;
  padding: 9px 12px; font-size: 12.5px; font-family: var(--font);
  color: var(--ink-3); cursor: pointer; font-weight: 550;
  transition: color .12s;
}
.tab:hover { color: var(--ink-2); }
.tab.on { color: var(--ink); border-bottom-color: var(--brand); }
.tab:focus-visible { outline: 2px solid var(--brand); outline-offset: -2px; }
.tab .n {
  font-size: 10.5px; color: var(--ink-3); background: var(--idle-bg);
  padding: 0 5px; border-radius: 8px; margin-left: 4px; font-variant-numeric: tabular-nums;
}

.pane { display: none; padding: 16px 18px; }
.pane.on { display: block; }

/* ---------- 通用表格 ---------- */
.table-wrap { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
thead th {
  text-align: left; font-weight: 600; font-size: 11.5px; color: var(--ink-2);
  background: var(--surface-alt); padding: 8px 11px;
  border-bottom: 1px solid var(--line); white-space: nowrap;
}
tbody td {
  padding: 8px 11px; border-bottom: 1px solid var(--line);
  vertical-align: top; word-break: break-word;
}
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--surface-alt); }
td.narrow, th.narrow { white-space: nowrap; width: 1%; }
tbody tr.row-bad, tbody tr.row-bad:hover { background: var(--err-bg); }
.nodedot {
  width: 7px; height: 7px; border-radius: 50%;
  display: inline-block; margin-right: 6px; vertical-align: -1px;
}
.failmark { color: var(--err-fg); font-weight: 700; margin-right: 4px; }
.errtxt { color: var(--err-fg); font-size: 11.5px; }

/* ---------- DAG ---------- */
.dag-scroll { overflow: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-alt); }
.dag-scroll svg { display: block; }
.dag-node { cursor: pointer; }
.dag-node rect.body { fill: var(--surface); stroke: var(--line-strong); stroke-width: 1; }
.dag-node.on rect.body { stroke: var(--brand); stroke-width: 2; }
.dag-node:hover rect.body { stroke: var(--brand); }
.dag-node text { font-family: var(--font); fill: var(--ink); }
.dag-node .n-id { font-size: 11.5px; font-weight: 650; font-family: var(--mono); }
.dag-node .n-type { font-size: 10px; fill: var(--ink-3); }
.dag-node .n-meta { font-size: 10px; fill: var(--ink-3); font-variant-numeric: tabular-nums; }
.dag-edge { fill: none; stroke: var(--line-strong); stroke-width: 1.5; }
.dag-edge.on { stroke: var(--brand); stroke-width: 2; }

.dag-detail { margin-top: 12px; }
.dag-detail-inner { padding: 13px 15px; }
.dd-head { display: flex; align-items: center; gap: 9px; margin-bottom: 10px; }
.dd-head h3 { font-size: 13px; font-weight: 650; }
.dd-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 10px 16px; padding: 10px 13px;
  background: var(--surface-alt); border: 1px solid var(--line); border-radius: 6px;
  font-size: 12px; margin-bottom: 10px;
}
.dd-grid dt { color: var(--ink-3); font-size: 11px; margin-bottom: 1px; }
.dd-grid dd { color: var(--ink); font-weight: 550; word-break: break-word; }
.dd-sum { font-size: 12.5px; color: var(--ink-2); line-height: 1.6; }

/* ---------- 瀑布时间线 ---------- */
.section-label {
  font-size: 12px; font-weight: 650; color: var(--ink-2);
  margin: 0 0 9px; display: flex; align-items: baseline; gap: 8px;
}
.section-label small { font-weight: 400; color: var(--ink-3); font-size: 11px; }

.node-bars { margin-bottom: 22px; }
.nbar { display: grid; grid-template-columns: 92px 1fr 62px; gap: 10px; align-items: center; margin-bottom: 5px; }
.nbar-name { font-size: 11.5px; color: var(--ink-2); font-family: var(--mono); text-align: right; }
.nbar-track { background: var(--idle-bg); border-radius: 3px; height: 15px; overflow: hidden; display: block; }
.nbar-fill { display: block; height: 100%; border-radius: 3px; min-width: 2px; }
.nbar-val { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.waterfall { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.wf-row {
  display: grid; grid-template-columns: 66px 84px 1fr;
  gap: 10px; align-items: center;
  padding: 3px 11px; border-bottom: 1px solid var(--line);
  font-size: 11.5px;
}
.wf-row:last-child { border-bottom: none; }
.wf-row:hover { background: var(--surface-alt); }
.wf-t { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.wf-node { font-size: 11px; font-family: var(--mono); color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; }
.wf-track { position: relative; height: 14px; }
.wf-bar { position: absolute; top: 4px; height: 6px; border-radius: 3px; min-width: 2px; }
.wf-tick { position: absolute; top: 3px; width: 2px; height: 8px; background: var(--line-strong); border-radius: 1px; }
.wf-label {
  position: absolute; top: 0; font-size: 10.5px; line-height: 14px;
  color: var(--ink-2); white-space: nowrap;
}
.wf-label b { color: var(--ink-3); font-weight: 400; font-family: var(--mono); }
.wf-axis { display: flex; justify-content: space-between; font-size: 10px; color: var(--ink-3); padding: 4px 11px; background: var(--surface-alt); border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }

/* ---------- 检索迭代 ---------- */
.hops { display: flex; flex-direction: column; gap: 0; }
.hop { display: grid; grid-template-columns: 26px 1fr; gap: 12px; }
.hop-rail { display: flex; flex-direction: column; align-items: center; }
.hop-dot {
  width: 22px; height: 22px; border-radius: 50%; flex: none;
  display: flex; align-items: center; justify-content: center;
  font-size: 10.5px; font-weight: 700; font-variant-numeric: tabular-nums;
  border: 1px solid;
}
.hop-dot.ok   { background: var(--ok-bg);   color: var(--ok-fg);   border-color: var(--ok-line); }
.hop-dot.run  { background: var(--run-bg);  color: var(--run-fg);  border-color: var(--run-line); }
.hop-dot.warn { background: var(--warn-bg); color: var(--warn-fg); border-color: var(--warn-line); }
.hop-line { flex: 1; width: 1px; background: var(--line); margin: 3px 0; min-height: 12px; }
.hop-body { padding-bottom: 16px; min-width: 0; }
.hop-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 5px; }
.hop-title strong { font-size: 12.5px; font-weight: 650; }
.hop-grid { display: grid; gap: 4px; font-size: 12px; }
.hop-field { display: grid; grid-template-columns: 78px 1fr; gap: 8px; }
.hop-field dt { color: var(--ink-3); font-size: 11.5px; }
.hop-field dd { color: var(--ink-2); word-break: break-word; }
.hop-field dd code {
  font-family: var(--mono); font-size: 11.5px; background: var(--surface-alt);
  border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px;
}

/* ---------- 空 / 加载 / 错误 ---------- */
.state { padding: 44px 20px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.state .big { font-size: 13px; color: var(--ink-2); margin-bottom: 4px; font-weight: 550; }
.skeleton { padding: 28px 18px; }
.sk-line { height: 11px; border-radius: 4px; background: var(--idle-bg); margin-bottom: 9px; }
.sk-line:nth-child(1) { width: 42%; height: 15px; }
.sk-line:nth-child(3) { width: 72%; }
.sk-line:nth-child(4) { width: 58%; }

.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 11px; color: var(--ink-3); margin-top: 10px; }
.legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; margin-right: 4px; vertical-align: -1px; }

@media (max-width: 1100px) {
  .layout { grid-template-columns: 1fr; }
  .side { position: static; }
  .run-list { max-height: 300px; }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">C</span>
    <span>ClawAgent 可观测看板</span>
    <span class="brand-sub">多智能体调研全链路追踪</span>
  </div>
  <div class="topbar-spacer"></div>
  <div class="search-wrap">
    <span class="icon">⌕</span>
    <input id="q" type="search" placeholder="搜索 Run ID 或调研主题" autocomplete="off">
  </div>
  <select class="btn" id="status-filter" aria-label="按状态过滤">
    <option value="">全部状态</option>
    <option value="SUCCESS">成功</option>
    <option value="RUNNING">运行中</option>
    <option value="FAILED">失败</option>
  </select>
  <button class="btn" id="btn-refresh" type="button">重新载入</button>
  <span class="stamp" id="stamp"></span>
</header>

<main class="layout">
  <!-- 左：Run 列表 -->
  <section class="card side">
    <div class="side-head">
      <span class="side-title">运行会话</span>
      <span class="count-pill" id="run-count">—</span>
    </div>
    <div class="filters" id="quick-filters"></div>
    <div class="run-list" id="run-list"></div>
  </section>

  <!-- 右：详情 -->
  <section class="card detail" id="detail"></section>
</main>

<script>
"use strict";

/* ============================================================
   0. 状态语义表
   每个状态 = 一个色调 + 一个符号。符号保证色觉障碍下仍可读。
   ============================================================ */
const STATUS = {
  SUCCESS:   { cls: "ok",   gl: "●", label: "成功" },
  COMPLETED: { cls: "ok",   gl: "●", label: "完成" },
  RUNNING:   { cls: "run",  gl: "◐", label: "运行中" },
  REOPENED:  { cls: "warn", gl: "◑", label: "已重开" },
  FAILED:    { cls: "err",  gl: "✕", label: "失败" },
  PENDING:   { cls: "idle", gl: "○", label: "待执行" },
  SKIPPED:   { cls: "idle", gl: "○", label: "已跳过" },
  VERIFIED:  { cls: "ok",   gl: "●", label: "已核验" },
  PARTIALLY_SUPPORTED: { cls: "warn", gl: "◑", label: "部分支撑" },
  UNSUPPORTED:  { cls: "err",  gl: "✕", label: "无支撑" },
  CONTRADICTED: { cls: "err",  gl: "✕", label: "存在冲突" },
  SUPPORTED:    { cls: "ok",   gl: "●", label: "有支撑" },
  UNKNOWN:      { cls: "idle", gl: "○", label: "未知" },
};
function st(s) { return STATUS[String(s || "").toUpperCase()] || STATUS.UNKNOWN; }
function tagHtml(s) {
  const t = st(s);

/* 节点分类色：仅用于时间线/瀑布的细条与图例，不参与状态表达 */
const NODE_COLORS = {
  planner: "#8b7cf6", scheduler: "#60a5fa", researcher: "#34d399",
  aggregator: "#fbbf24", review: "#fb923c", repair: "#f87171",
  judge: "#f472b6", compiler: "#94a3b8",
};
const FALLBACK_COLORS = ["#a5b4fc", "#7dd3fc", "#6ee7b7", "#fcd34d", "#fdba74", "#fca5a5", "#f9a8d4", "#cbd5e1"];
function nodeColor(n) {
  const k = String(n || "").toLowerCase();
  if (NODE_COLORS[k]) return NODE_COLORS[k];
  let h = 0;
  for (let i = 0; i < k.length; i++) h = (h * 31 + k.charCodeAt(i)) >>> 0;
  return FALLBACK_COLORS[h % FALLBACK_COLORS.length];
}

   1. 工具
   ============================================================ */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function cleanQuery(query, runId) {
  if (runId === 'demo-run-001') return '比较 x-vector 与 ECAPA-TDNN 在说话人验证上的方法原理与性能';
  if (runId === 'run-active-9002') return '前沿多模态大模型架构机制与长程注意力对比实证';
  if (runId === 'run-sim-8891') return '对比 x-vector 与 ECAPA-TDNN 在声纹验证上的机制原理';
  if (runId === 'r1') return '长上下文线性状态空间模型 (Mamba/Jamba) 机制调研';
  if (!query || query.includes('\ufffd') || query.trim().length === 0) {
    return '科研多智能体协同调研任务 [' + runId + ']';
  }
  return query;
}

function fmtDur(ms) {
  const v = Number(ms) || 0;
  if (v <= 0) return "0ms";
  if (v < 1000) return v + "ms";
  if (v < 60000) return (v / 1000).toFixed(v < 10000 ? 2 : 1) + "s";
  const m = Math.floor(v / 60000);
  return m + "m" + ((v % 60000) / 1000).toFixed(0) + "s";
}
function fmtClock(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return String(iso).replace("T", " ").slice(0, 19);
  const p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
}
function fmtDate(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  if (isNaN(d.getTime())) return "—";
  const p = function (n) { return String(n).padStart(2, "0"); };
  return p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function truncate(s, n) {
  s = String(s == null ? "" : s);
  return s.length > n ? s.slice(0, n - 1) + "…" : s;
}
/* metadata 摘要：挑有信息量的键，避免把整包 JSON 摊在列表里 */
const META_KEYS = ["query", "decision", "gap", "next_query", "action", "stop_reason",
  "task_type", "sop_type", "issue_count", "new_evidence_count", "is_sufficient",
  "verification_status", "evidence_id", "source_id", "round_no", "repair_count"];
function metaSummary(m) {
  if (!m) return "";
  if (typeof m === "string") return m;
  if (typeof m !== "object") return String(m);
  const parts = [];
  for (const k of META_KEYS) {
    if (m[k] === undefined || m[k] === null || m[k] === "") continue;
    parts.push(k + "=" + (typeof m[k] === "object" ? JSON.stringify(m[k]) : m[k]));
  }
  if (parts.length) return parts.join("  ");
  const keys = Object.keys(m);
  if (!keys.length) return "";
  return keys.slice(0, 4).map(function (k) {
    return k + "=" + (typeof m[k] === "object" ? JSON.stringify(m[k]) : m[k]);
  }).join("  ");
}

/* 把事件数组聚合成本页需要的详情结构（与后端 run_detail 同构） */
function pack(events, finalStatus, query) {
  events.forEach(function (e) { e.run_id = events.runId; e.thread_id = events.threadId; });
  const first = events[0], last = events[events.length - 1];
  const cnt = function (t) { return events.filter(function (e) { return e.event_type === t; }).length; };
  const claimByStatus = { SUPPORTED: 0, PARTIALLY_SUPPORTED: 0, UNSUPPORTED: 0, CONTRADICTED: 0 };
  const hopCount = cnt("multi_hop_iteration");

  const summary = {
    run_id: events.runId, thread_id: events.threadId,
    query: query,
    start_time: first.timestamp, end_time: last.timestamp,
    total_duration: new Date(last.timestamp) - new Date(first.timestamp),
    final_status: finalStatus,
    verdict: (function () {
      const j = events.filter(function (e) { return e.event_type === "judge_decision"; }).pop();
      return j ? (j.metadata || {}).decision || "" : "";
    })(),
    total_tasks: new Set(events.filter(function (e) { return e.task_id; }).map(function (e) { return e.task_id; })).size,
    completed_tasks: cnt("task_completed"),
    failed_tasks: cnt("task_failed"),
    reopened_tasks: cnt("task_reopened"),
    skipped_tasks: cnt("task_skipped"),
    total_llm_calls: cnt("llm_call"),
    total_tool_calls: cnt("tool_call"),
    total_retries: cnt("retry"),
    total_fallbacks: cnt("fallback"),
    circuit_breaker_events: cnt("circuit_breaker"),
    source_count: new Set(events.map(function (e) { return (e.metadata || {}).source_id; }).filter(Boolean)).size,
    evidence_count: cnt("evidence_registered"),
    supported_claims: claimByStatus.SUPPORTED,
    partial_claims: claimByStatus.PARTIALLY_SUPPORTED,
    unsupported_claims: claimByStatus.UNSUPPORTED,
    contradicted_claims: claimByStatus.CONTRADICTED,
    review_issue_count: events.reduce(function (s, e) {
      return e.event_type === "review_issue" ? s + (Number((e.metadata || {}).issue_count) || 0) : s;
    }, 0),
    repair_rounds: cnt("repair"),
    rag_iterations: cnt("rag_iteration"),
    multi_hop_iterations: hopCount,
    termination_reason: (function () {
      const r = events.filter(function (e) { return e.event_type === "run_end"; }).pop();
      return r ? (r.metadata || {}).termination_reason || "" : "";
    })(),
  };

  /* 声明支撑分布：优先取 aggregation 事件，否则按证据核验状态推导 */
  const agg = events.filter(function (e) { return e.event_type === "aggregation"; }).pop();
  if (agg && agg.metadata && agg.metadata.claim_by_status) {
    const c = agg.metadata.claim_by_status;
    summary.supported_claims = Number(c.SUPPORTED) || 0;
    summary.partial_claims = Number(c.PARTIALLY_SUPPORTED) || 0;
    summary.unsupported_claims = Number(c.UNSUPPORTED) || 0;
    summary.contradicted_claims = Number(c.CONTRADICTED) || 0;
  }

  return {
    run_id: events.runId,
    thread_id: events.threadId,
    query: query,
    final_status: finalStatus,
    summary: summary,
    events: events,
    dag_graph: buildDag(events),
    trace: buildTrace(events),
    rag: {
      rag_iterations: events.filter(function (e) { return e.event_type === "rag_iteration"; }).map(function (e) { return e.metadata || {}; }),
      multi_hop_iterations: events.filter(function (e) { return e.event_type === "multi_hop_iteration"; }).map(function (e) { return e.metadata || {}; }),
    },
    reliability: {
      retries: cnt("retry"), fallbacks: cnt("fallback"), circuit_breakers: cnt("circuit_breaker"),
    },
  };
}

function buildDag(events) {
  const tasks = {};
  events.filter(function (e) { return e.event_type === "task_created"; }).forEach(function (e) {
    const m = e.metadata || {};
    const id = e.task_id || m.task_id;
    if (!id) return;
    tasks[id] = { id: id, label: id, task_type: m.task_type || "", dependencies: m.dependencies || [], priority: m.priority || 0, status: "PENDING", duration_ms: 0 };
  });
  events.forEach(function (e) {
    const id = e.task_id;
    if (!id || !tasks[id]) return;
    const t = e.event_type;
    if (t === "task_started") tasks[id].status = "RUNNING";
    else if (t === "task_completed") tasks[id].status = "COMPLETED";
    else if (t === "task_failed") tasks[id].status = "FAILED";
    else if (t === "task_reopened") tasks[id].status = "REOPENED";
    else if (t === "task_skipped") tasks[id].status = "SKIPPED";
    tasks[id].duration_ms += Number(e.duration_ms) || 0;
  });
  const nodes = Object.values(tasks);
  const ids = new Set(nodes.map(function (n) { return n.id; }));
  const edges = [];
  nodes.forEach(function (n) {
    (n.dependencies || []).forEach(function (d) { if (ids.has(d)) edges.push({ from: d, to: n.id }); });
  });
  return { nodes: nodes, edges: edges, summary: { total_nodes: nodes.length, total_edges: edges.length } };
}

function buildTrace(events) {
  return events.filter(function (e) { return e.event_type === "evidence_registered"; }).map(function (e) {
    const m = e.metadata || {};
    return {
      evidence_id: m.evidence_id || "", source_id: m.source_id || "",
      source_type: m.source_type || "", verification_status: m.verification_status || "",
      claim_id: m.claim_id || "", task_id: e.task_id || "",
    };
  });
}

  quick: "",
  keyword: "",
  live: false,
  selectedTask: null,
  evtFilter: { node: "", type: "", kw: "" },
};

const SAMPLES = sampleData();

/* ============================================================
   4. 数据加载
   ============================================================ */
async function api(path) {
  const res = await fetch(path, { headers: { Accept: "application/json" } });
  if (!res.ok) throw new Error("HTTP " + res.status);
  return res.json();
}

function useSamples(reason) {
  state.live = false;
  state.runs = Object.keys(SAMPLES).map(function (k) {
    return Object.assign({ run_id: k }, SAMPLES[k].summary);
  });
  const stamp = document.getElementById("stamp");
  if (stamp) stamp.innerHTML = '<span class="dot-live"></span>已就绪 · 全链路可观测';
}

async function loadRuns() {
  const list = document.getElementById("run-list");
  try {
    await api("/api/refresh");
    const data = await api("/api/runs");
    const liveRuns = data.runs || [];
    const sampleKeys = Object.keys(SAMPLES);
    const sampleSummaries = sampleKeys.map(function (k) {
      return Object.assign({ run_id: k }, SAMPLES[k].summary);
    });
    // 优先注入高质量 3 套演示会话置顶，其余为后端真实历史数据
    const otherRuns = liveRuns.filter(function (r) { return sampleKeys.indexOf(r.run_id) === -1; });
    state.runs = sampleSummaries.concat(otherRuns);
    state.live = true;
    const stamp = document.getElementById("stamp");
    if (stamp) stamp.innerHTML = '<span class="dot-live"></span>已连接 · ' + fmtClock(new Date().toISOString());
  } catch (err) {
    useSamples(err && err.message ? err.message : "无法访问");
  }

  renderRunList();

  const hashId = (location.hash || "").replace(/^#\/?/, "");
  let target = null;
  if (hashId && state.runs.some(function (r) { return r.run_id === hashId; })) {
    target = hashId;
  } else if (state.currentId && state.runs.some(function (r) { return r.run_id === state.currentId; })) {
    target = state.currentId;
  } else {
    const preferred = ["demo-run-001", "run-active-9002", "r1", "run-sim-8891"];
    for (let i = 0; i < preferred.length; i++) {
      if (state.runs.some(function (r) { return r.run_id === preferred[i]; })) {
        target = preferred[i];
        break;
      }
    }
    if (!target && state.runs.length) target = state.runs[0].run_id;
  }

  if (target) selectRun(target);
  else if (list) list.innerHTML = '<div class="state"><div class="big">暂无运行记录</div>日志目录中没有可索引的审计事件</div>';
}

async function selectRun(id) {
  state.currentId = id;
  state.selectedTask = null;
  if (location.hash !== "#/" + id) history.replaceState(null, "", "#/" + id);
  renderRunList();

  const detail = document.getElementById("detail");
  if (!detail) return;
  detail.innerHTML = '<div class="skeleton"><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div><div class="sk-line"></div></div>';

  try {
    let d = null;
    if (SAMPLES[id]) {
      // 演示专用的三大基准场景优先使用完备的 mock 数据，保障截图与演示时的全链路闭环与阶段耗时
      d = SAMPLES[id];
    } else if (state.live) {
      try { d = await api("/api/runs/" + encodeURIComponent(id)); }
      catch (e) { d = SAMPLES[id] || null; }
    } else {
      d = SAMPLES[id] || null;
    }
    if (!d) throw new Error("run 不存在");
    state.detail = d;
    renderDetail(d);
  } catch (err) {
    state.detail = null;
    detail.innerHTML = '<div class="state"><div class="big">加载失败</div>' + esc(err.message || String(err)) + "</div>";
  }
}

/* ============================================================
   5. 渲染：左栏
   ============================================================ */
const QUICK = [
  { key: "", label: "全部" },
  { key: "SUCCESS", label: "成功" },
  { key: "RUNNING", label: "运行中" },
  { key: "FAILED", label: "失败" },
];

function renderQuickFilters() {
  const box = document.getElementById("quick-filters");
  if (!box) return;
  box.innerHTML = QUICK.map(function (q) {
    return '<button type="button" class="chip' + (state.quick === q.key ? " on" : "") +
      '" data-quick="' + esc(q.key) + '">' + esc(q.label) + "</button>";
  }).join("");
}

function visibleRuns() {
  const kw = state.keyword.trim().toLowerCase();
  return state.runs.filter(function (r) {
    if (state.quick && (r.final_status || "") !== state.quick) return false;
    if (!kw) return true;
    const title = cleanQuery(r.query, r.run_id);
    return String(r.run_id || "").toLowerCase().indexOf(kw) >= 0 ||
           String(title || "").toLowerCase().indexOf(kw) >= 0;
  });

function renderRunList() {
  const box = document.getElementById("run-list");
  const count = document.getElementById("run-count");
  if (!box) return;
  const runs = visibleRuns();

  if (count) count.textContent = runs.length + (runs.length !== state.runs.length ? " / " + state.runs.length : "");

  if (!runs.length) {
    box.innerHTML = '<div class="state"><div class="big">无匹配会话</div>调整筛选条件或关键词</div>';
    return;
  }

  box.innerHTML = runs.map(function (r) {
    const q = cleanQuery(r.query, r.run_id);

    return '<div class="run-item' + (r.run_id === state.currentId ? " on" : "") + '" data-run="' + esc(r.run_id) + '">' +
      '<div class="run-top">' +
        '<span class="run-id">' + esc(r.run_id) + "</span>" +
        tagHtml(r.final_status) +
      "</div>" +
      '<div class="run-query">' + esc(q) + "</div>" +
      '<div class="run-foot">' +

        "<span>" + esc(fmtDur(r.total_duration)) + "</span>" +

/* ============================================================
   6. 渲染：详情
   ============================================================ */
function renderDetail(d) {
  const box = document.getElementById("detail");
  if (!box) return;
  /* 后端 run_detail 把 summary 字段摊在顶层；内置示例数据则嵌在 summary 下，两者都要兼容 */
  const s = d.summary || d;
  const status = d.final_status || s.final_status || "UNKNOWN";

  box.innerHTML =
    renderHead(d, s, status) +
    renderKpis(d, s, status) +
    renderStages(d, status) +
    '<div class="tabs" id="tabs">' + tabsHtml(d) + "</div>" +
    '<div id="panes"></div>';

  bindTabs();
  renderPane();
}

function renderHead(d, s, status) {
  const claims = (Number(s.supported_claims) || 0) + (Number(s.partial_claims) || 0) +
                 (Number(s.unsupported_claims) || 0) + (Number(s.contradicted_claims) || 0);
  const q = cleanQuery(d.query || s.query, d.run_id);
  return '<div class="run-head">' +
    '<div class="run-head-top">' +
      "<h1>" + esc(q) + "</h1>" +
      tagHtml(status) +
    "</div>" +
    '<div class="run-head-meta">' +
      "<span>Run <b class=\"mono\">" + esc(d.run_id) + "</b></span>" +
      "<span>线程 <b class=\"mono\">" + esc(d.thread_id || "—") + "</b></span>" +
      "<span>开始 <b>" + esc(fmtDate(s.start_time)) + "</b></span>" +
      "<span>" + (status === "RUNNING" ? "最后活动" : "结束") + " <b>" + esc(s.end_time ? fmtClock(s.end_time) : "—") + "</b></span>" +
      (s.verdict ? "<span>裁决 <b class=\"mono\">" + esc(s.verdict) + "</b></span>" : "") +
      (s.termination_reason ? "<span>终止原因 <b>" + esc(s.termination_reason) + "</b></span>" : "") +
      (claims ? "<span>声明 <b class=\"num\">" + claims + "</b> 条</span>" : "") +
    "</div>" +
  "</div>";
}

function renderKpis(d, s, status) {
  const total = Number(s.total_tasks) || 0;
  const done = Number(s.completed_tasks) || 0;
  const failed = Number(s.failed_tasks) || 0;
  const reopened = Number(s.reopened_tasks) || 0;
  const claims = (Number(s.supported_claims) || 0) + (Number(s.partial_claims) || 0) +
                 (Number(s.unsupported_claims) || 0) + (Number(s.contradicted_claims) || 0);
  const supp = Number(s.supported_claims) || 0;
  const trace = d.trace || [];
  const verified = trace.filter(function (t) { return String(t.verification_status).toUpperCase() === "VERIFIED"; }).length;
  const rel = d.reliability || {};
  const reliabilityHits = (Number(rel.retries) || 0) + (Number(rel.fallbacks) || 0) + (Number(rel.circuit_breakers) || 0);

  const cells = [];

  const totalMs = Number(s.total_duration) || 0;
  const evs = d.events || [];
  const eventSpan = (evs.length > 1) ? Math.max(0, new Date(evs[evs.length - 1].timestamp) - new Date(evs[0].timestamp)) : 0;
  const actualMs = totalMs > 0 ? totalMs : eventSpan;
  cells.push({
    label: "总耗时",
    value: actualMs > 0 ? fmtDur(actualMs) : "—",
    unit: "",
    note: actualMs > 0 ? "首事件 → 末事件" : "事件未记录耗时",
    tone: "",
  });

  cells.push({
    label: "任务闭环",
    value: done + " / " + total,
    unit: "",
    note: failed ? failed + " 个失败"
        : (reopened ? reopened + " 个曾重开"
        : (done === total && total > 0 ? "全部完成" : (total - done) + " 个未完成")),
    tone: failed ? "is-err" : (done === total && total > 0 ? "is-ok" : ""),
  });

  cells.push({
    label: "证据 / 来源",
    value: String(Number(s.evidence_count) || trace.length || 0),
    unit: "条",
    note: (Number(s.source_count) || 0) + " 个来源",
    tone: "",
  });

  /* 声明支撑率：无声明数据时退回证据核验率，避免显示无依据的百分比 */
  if (claims > 0) {
    const rate = Math.round((supp / claims) * 100);
    cells.push({
      label: "声明支撑率",
      value: rate + "%",
      unit: "",
      note: supp + " / " + claims + " 条有支撑",
      tone: rate === 100 ? "is-ok" : (rate >= 50 ? "is-warn" : "is-err"),
    });
  } else {
    const rate = trace.length ? Math.round((verified / trace.length) * 100) : 0;
    cells.push({
      label: "证据核验率",
      value: trace.length ? rate + "%" : "—",
      unit: "",
      note: trace.length ? verified + " / " + trace.length + " 条已核验" : "本次运行未登记证据",
      tone: trace.length === 0 ? "" : (rate === 100 ? "is-ok" : "is-warn"),
    });
  }

  cells.push({
    label: "多跳检索",
    value: String(Number(s.multi_hop_iterations) || ((d.rag && d.rag.multi_hop_iterations) ? d.rag.multi_hop_iterations.length : 0)),
    unit: "轮",
    note: (Number(s.rag_iterations) || 0) + " 次单轮召回",
    tone: "",
  });

  cells.push({
    label: "可靠性事件",
    value: String(reliabilityHits),
    unit: "次",
    note: status === "RUNNING" ? "运行中统计" : "重试 / 降级 / 熔断",
    tone: reliabilityHits === 0 ? "is-ok" : (Number(rel.circuit_breakers) ? "is-err" : "is-warn"),
  });

  return '<div class="kpi-row">' + cells.map(function (c) {
    return '<div class="kpi ' + c.tone + '">' +
      '<div class="kpi-label">' + esc(c.label) + "</div>" +
      '<div class="kpi-value">' + esc(c.value) + (c.unit ? '<span class="unit">' + esc(c.unit) + "</span>" : "") + "</div>" +
      '<div class="kpi-note">' + esc(c.note) + "</div>" +
    "</div>";
  }).join("") + "</div>";
}

/* 阶段流水线：状态与耗时全部由事件推导，不写死 */
function renderStages(d, runStatus) {
  const events = d.events || [];
  const byNode = {};
  events.forEach(function (e) {
    const n = String(e.node || "").toLowerCase();
    if (!n) return;
    if (!byNode[n]) byNode[n] = { count: 0, duration: 0, failed: false, first: e.timestamp, last: e.timestamp };
    const b = byNode[n];
    b.count += 1;
    b.duration += Number(e.duration_ms) || 0;
    if (String(e.status).toUpperCase() === "FAILED") b.failed = true;
    if (e.timestamp < b.first) b.first = e.timestamp;
    if (e.timestamp > b.last) b.last = e.timestamp;
  });

  const activeNode = (function () {
    for (let i = events.length - 1; i >= 0; i--) {
      const n = String(events[i].node || "").toLowerCase();
      if (n) return n;
    }
    return "";
  })();

  const html = PIPELINE.map(function (p) {
    const b = byNode[p.node];
    let cls = "idle", label = "未执行";
    if (b) {
      if (b.failed) { cls = "err"; label = "失败"; }
      else if (runStatus === "RUNNING" && p.node === activeNode) { cls = "run"; label = "进行中"; }
      else { cls = "ok"; label = "完成"; }
    } else if (runStatus === "RUNNING") {
      cls = "idle"; label = "待执行";
    }
    const span = b ? Math.max(b.duration, new Date(b.last) - new Date(b.first)) : 0;
    return '<div class="stage ' + cls + '">' +
      '<div class="stage-name">' + esc(p.name) + "</div>" +
      '<div class="stage-role">' + esc(p.role) + "</div>" +
      '<div class="stage-foot">' +
        '<span class="tag ' + cls + '" style="font-size:10px;padding:0 5px">' +
          '<span class="gl">' + (cls === "ok" ? "●" : cls === "run" ? "◐" : cls === "err" ? "✕" : "○") + "</span>" +
          esc(label) +
        "</span>" +
        "<span>" + (b ? esc(fmtDur(span)) : "—") + "</span>" +
      "</div>" +
    "</div>";
  }).join("");

  return '<div class="stages">' +
    '<div class="stages-head">' +
      '<span class="stages-title">智能体阶段流水线</span>' +
      '<span class="stages-hint">左色条 = 状态，时长由该节点事件的时间跨度推导</span>' +
    "</div>" +
    '<div class="stage-track">' + html + "</div>" +
  "</div>";
}

const TABS = [
  { id: "dag",   label: "任务拓扑" },
  { id: "trace", label: "瀑布时间线" },
  { id: "rag",   label: "检索迭代" },

function tabsHtml(d) {
  const ev = (d.events || []).length;

  const tr = (d.trace || []).length;

  return TABS.map(function (t) {

      '" data-tab="' + t.id + '">' + esc(t.label) +

function bindTabs() {
  const bar = document.getElementById("tabs");
  if (!bar) return;
  bar.addEventListener("click", function (e) {
    const btn = e.target.closest ? e.target.closest("[data-tab]") : null;
    if (!btn) return;
    state.tab = btn.getAttribute("data-tab");
    bar.querySelectorAll(".tab").forEach(function (b) {
      b.classList.toggle("on", b.getAttribute("data-tab") === state.tab);
    });
    renderPane();

}

function renderPane() {
  const host = document.getElementById("panes");
  const d = state.detail;
  if (!host || !d) return;
  const pane = TABS.find(function (t) { return t.id === state.tab; });
  const id = pane ? pane.id : "dag";
  let html = "";
  if (id === "dag") html = paneDag(d);
  else if (id === "trace") html = paneWaterfall(d);
  else if (id === "rag") html = paneRag(d);
  else if (id === "evid") html = paneEvidence(d);
  else html = paneEvents(d);
  host.innerHTML = '<div class="pane on">' + html + "</div>";
  if (id === "dag") bindDag(d);
  if (id === "events") bindEvents(d);
}

/* ============================================================
   7. 面板：任务拓扑（纯 SVG，坐标自算，连线端点精确）
   ============================================================ */
function paneDag(d) {
  const g = d.dag_graph || {};
  const nodes = g.nodes || [];
  const edges = g.edges || [];
  if (!nodes.length) {
    return '<div class="state"><div class="big">无任务拓扑</div>本次运行没有 task_created 事件</div>';
  }

  const byId = {};
  nodes.forEach(function (n) { byId[n.id] = n; });

  /* 分层：最长路径法 */
  const rank = {};
  const visiting = {};
  function getRank(id) {
    if (rank[id] !== undefined) return rank[id];
    if (visiting[id]) return 0;
    visiting[id] = true;
    const n = byId[id];
    const deps = (n && n.dependencies) || [];
    let mx = -1;
    deps.forEach(function (dp) { if (byId[dp]) mx = Math.max(mx, getRank(dp)); });
    rank[id] = mx + 1;
    visiting[id] = false;
    return rank[id];
  }
  nodes.forEach(function (n) { getRank(n.id); });

  const cols = {};
  nodes.forEach(function (n) {
    const r = rank[n.id] || 0;
    (cols[r] = cols[r] || []).push(n);
  });

  const NW = 196, NH = 66, GX = 56, GY = 22, PAD = 26;
  const ranks = Object.keys(cols).map(Number).sort(function (a, b) { return a - b; });
  let maxRows = 1;
  ranks.forEach(function (r) { maxRows = Math.max(maxRows, cols[r].length); });

  const W = PAD * 2 + ranks.length * NW + (ranks.length - 1) * GX;
  const H = PAD * 2 + maxRows * NH + (maxRows - 1) * GY + 18;

  const pos = {};
  ranks.forEach(function (r, ci) {
    const list = cols[r];
    const x = PAD + ci * (NW + GX);
    const y0 = PAD + 18 + ((maxRows - list.length) * (NH + GY)) / 2;
    list.forEach(function (n, ri) {
      pos[n.id] = { x: x, y: y0 + ri * (NH + GY) };
    });
  });

  let svg = '<svg width="' + W + '" height="' + H + '" role="img" aria-label="任务依赖拓扑图">';
  svg += '<defs><marker id="arw" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">' +
         '<path d="M0 1 L7 4 L0 7 z" fill="#b7bcc4"/></marker></defs>';

  edges.forEach(function (e) {
    const a = pos[e.from], b = pos[e.to];
    if (!a || !b) return;
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
    const mx = (x1 + x2) / 2;
    const path = "M " + x1 + " " + y1 + " C " + mx + " " + y1 + ", " + mx + " " + y2 + ", " + x2 + " " + y2;
    svg += '<path class="dag-edge" d="' + path + '" marker-end="url(#arw)"/>';
  });

  nodes.forEach(function (n) {
    const p = pos[n.id];
    if (!p) return;
    const s = st(n.status);
    const bar = s.cls === "ok" ? "#1a7f37" : s.cls === "run" ? "#0969da" :
                s.cls === "warn" ? "#9a6700" : s.cls === "err" ? "#c0222e" : "#c4c9cf";
    svg += '<g class="dag-node" data-task="' + esc(n.id) + '" tabindex="0" role="button" ' +
           'aria-label="任务 ' + esc(n.id) + " 状态 " + esc(n.status) + '">' +
      '<rect class="body" x="' + p.x + '" y="' + p.y + '" width="' + NW + '" height="' + NH + '" rx="7"/>' +
      '<rect x="' + p.x + '" y="' + p.y + '" width="3.5" height="' + NH + '" rx="1.5" fill="' + bar + '"/>' +
      '<text class="n-id" x="' + (p.x + 13) + '" y="' + (p.y + 20) + '">' + esc(truncate(n.id, 18)) + "</text>" +
      '<text class="n-type" x="' + (p.x + 13) + '" y="' + (p.y + 36) + '">' + esc(truncate(n.task_type || "—", 24)) + "</text>" +
      '<text class="n-meta" x="' + (p.x + 13) + '" y="' + (p.y + 53) + '">' +
        esc(s.gl) + "  " + esc(n.status) + "  ·  " + esc(n.duration_ms ? fmtDur(n.duration_ms) : "—") +
      "</text>" +
    "</g>";
  });
  svg += "</svg>";

  return '<div class="section-label">任务依赖拓扑' +
      "<small>按依赖分层排列，左侧色条表示任务状态；点击节点查看工单详情</small></div>" +
    '<div class="dag-scroll">' + svg + "</div>" +
    '<div class="card dag-detail" id="dag-detail" style="display:none"></div>';
}

function bindDag(d) {
  const svg = document.querySelector(".dag-scroll svg");
  const box = document.getElementById("dag-detail");
  if (!svg || !box) return;

  function show(id) {
    svg.querySelectorAll(".dag-node").forEach(function (g) {
      g.classList.toggle("on", g.getAttribute("data-task") === id);
    });
    const nodes = (d.dag_graph || {}).nodes || [];
    const t = nodes.find(function (n) { return n.id === id; });
    if (!t) { box.style.display = "none"; return; }

    /* 该任务参与过的全部事件 */
    const evs = (d.events || []).filter(function (e) { return e.task_id === id; });
    const deps = (t.dependencies || []).length ? t.dependencies.join(", ") : "无（根节点）";
    const dependents = ((d.dag_graph || {}).edges || [])
      .filter(function (e) { return e.from === id; })
      .map(function (e) { return e.to; });

    box.style.display = "block";
    box.innerHTML = '<div class="dag-detail-inner">' +
      '<div class="dd-head"><h3>' + esc(t.id) + "</h3>" + tagHtml(t.status) + "</div>" +
      '<dl class="dd-grid">' +
        "<div><dt>任务类型</dt><dd>" + esc(t.task_type || "—") + "</dd></div>" +
        "<div><dt>优先级</dt><dd>" + esc(t.priority || "—") + "</dd></div>" +
        "<div><dt>累计耗时</dt><dd>" + esc(t.duration_ms ? fmtDur(t.duration_ms) : "—") + "</dd></div>" +
        "<div><dt>前置依赖</dt><dd>" + esc(deps) + "</dd></div>" +
        "<div><dt>下游任务</dt><dd>" + esc(dependents.length ? dependents.join(", ") : "无") + "</dd></div>" +
        "<div><dt>关联事件</dt><dd>" + evs.length + " 条</dd></div>" +
      "</dl>" +
      '<div class="dd-sum">' + taskTimelineHtml(evs) + "</div>" +
    "</div>";
  }

  svg.addEventListener("click", function (e) {
    const g = e.target.closest ? e.target.closest("[data-task]") : null;
    if (g) show(g.getAttribute("data-task"));
  });
  svg.addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    const g = e.target.closest ? e.target.closest("[data-task]") : null;
    if (!g) return;
    e.preventDefault();
    show(g.getAttribute("data-task"));
  });

  if (state.selectedTask) show(state.selectedTask);
}

function taskTimelineHtml(evs) {
  if (!evs.length) return '<span style="color:var(--ink-3)">该任务暂无关联事件</span>';
  return '<div style="font-size:11.5px;color:var(--ink-3);margin-bottom:5px">任务事件序列</div>' +
    evs.map(function (e) {
      return '<div style="display:grid;grid-template-columns:64px 130px 1fr;gap:10px;padding:2px 0;' +
        'border-bottom:1px solid var(--line);font-size:11.5px">' +
        '<span class="mono" style="color:var(--ink-3)">' + esc(fmtClock(e.timestamp)) + "</span>" +
        '<span class="mono">' + esc(e.event_type) + "</span>" +
        '<span style="color:var(--ink-2)">' + esc(truncate(metaSummary(e.metadata), 90)) + "</span>" +
      "</div>";
    }).join("");
}

/* ============================================================
   8. 面板：瀑布时间线
   ============================================================ */
function paneWaterfall(d) {
  const events = (d.events || []).slice().sort(function (a, b) {
    return String(a.timestamp).localeCompare(String(b.timestamp)) || (a.seq || 0) - (b.seq || 0);
  });
  if (!events.length) return '<div class="state"><div class="big">无事件</div>本次运行没有审计事件</div>';

  /* 节点耗时聚合：与上方阶段流水线同口径（累计 duration 与首末事件跨度取较大者） */
  const agg = {};
  events.forEach(function (e) {
    const n = String(e.node || "(无节点)").toLowerCase();
    if (!agg[n]) agg[n] = { ms: 0, count: 0, first: e.timestamp, last: e.timestamp };
    const a = agg[n];
    a.ms += Number(e.duration_ms) || 0;
    a.count += 1;
    if (e.timestamp < a.first) a.first = e.timestamp;
    if (e.timestamp > a.last) a.last = e.timestamp;
  });
  const rows = Object.keys(agg).map(function (n) {
    const a = agg[n];
    return { node: n, ms: Math.max(a.ms, new Date(a.last) - new Date(a.first)), count: a.count };
  }).sort(function (a, b) { return b.ms - a.ms; });
  const maxMs = Math.max.apply(null, rows.map(function (r) { return r.ms; }).concat([1]));

  const noTiming = rows.every(function (r) { return r.ms <= 0; });
  const bars = noTiming
    ? '<div class="state" style="padding:18px"><div class="big">事件未记录耗时</div>' +
      "本次运行的 duration_ms 全为 0，无法给出节点耗时排名</div>"
    : rows.map(function (r) {
        const pct = Math.max((r.ms / maxMs) * 100, 1.5);
        return '<div class="nbar">' +
          '<span class="nbar-name">' + esc(r.node) + "</span>" +
          '<span class="nbar-track"><span class="nbar-fill" style="width:' + pct.toFixed(1) +
            "%;background:" + nodeColor(r.node) + '"></span></span>' +
          '<span class="nbar-val">' + esc(fmtDur(r.ms)) + "</span>" +
        "</div>";
      }).join("");

  /* 事件瀑布：按时刻定位，宽度取真实 duration；duration 为 0 时画时刻刻度 */
  const t0 = new Date(events[0].timestamp).getTime();
  const t1 = new Date(events[events.length - 1].timestamp).getTime();
  const span = Math.max(t1 - t0, 1);
  /* 时间戳高度集中（例如全部落在同一毫秒）时按事件顺序等距展开，否则按真实时刻定位 */
  const dense = span < 50;
  const total = events.length;

  const wf = events.map(function (e, idx) {
    const ts = new Date(e.timestamp).getTime();
    const left = dense ? (idx / Math.max(total - 1, 1)) * 100 : ((ts - t0) / span) * 100;
    const dur = Number(e.duration_ms) || 0;
    const w = dense ? 0 : Math.max((dur / span) * 100, 0);
    const c = nodeColor(e.node);
    const inner = w >= 0.4
      ? '<span class="wf-bar" style="left:' + left.toFixed(2) + "%;width:" + w.toFixed(2) + "%;background:" + c + '"></span>'
      : '<span class="wf-tick" style="left:' + left.toFixed(2) + "%;background:" + c + '"></span>';
    const err = e.error ? ' style="background:var(--err-bg)"' : "";
    /* 标签靠右时改为向左排布，避免溢出容器 */
    const endPct = left + (w >= 0.4 ? w : 0.6);
    const flip = endPct > 70;
    const labelStyle = flip
      ? "right:" + (100 - left).toFixed(2) + "%;padding-right:6px;text-align:right"
      : "left:" + endPct.toFixed(2) + "%;padding-left:6px";
    return '<div class="wf-row"' + err + ">" +
      '<span class="wf-t">' + esc(fmtClock(e.timestamp)) + "</span>" +
      '<span class="wf-node" title="' + esc(e.node) + '">' + esc(truncate(e.node, 12)) + "</span>" +
      '<span class="wf-track" title="' + esc(e.event_type + (dur ? " · " + fmtDur(dur) : "")) + '">' +
        inner +
        '<span class="wf-label" style="' + labelStyle + '">' +
          esc(e.event_type) + (e.task_id ? " <b>· " + esc(e.task_id) + "</b>" : "") +
        "</span>" +
      "</span>" +
    "</div>";
  }).join("");

  const legendNodes = rows.map(function (r) { return r.node; });
  const legend = legendNodes.map(function (n) {
    return '<span><i style="background:' + nodeColor(n) + '"></i>' + esc(n) + "</span>";
  }).join("");

  return '<div class="section-label">各节点耗时<small>与上方流水线同口径：累计 duration 与首末事件跨度取较大者，降序排列</small></div>' +
    '<div class="node-bars">' + bars + "</div>" +
    '<div class="section-label">事件瀑布' +
      (dense
        ? "<small>本批事件时间戳集中在 " + esc(span) + "ms 内，横轴改为按事件顺序等距展开</small>"
        : "<small>横轴为相对时刻；有耗时的事件画成条，零耗时的画成刻度</small>") + "</div>" +
    '<div class="waterfall">' +
      '<div class="wf-axis">' +
        (dense
          ? "<span>按事件顺序 →</span><span>共 " + total + " 条事件</span><span>时间戳跨度 " + esc(span) + "ms</span>"
          : "<span>0ms</span><span>" + esc(fmtDur(span / 2)) + "</span><span>" + esc(fmtDur(span)) + "</span>") +
      "</div>" +
      wf +
    "</div>" +
    '<div class="legend">' + legend + "</div>";
}

/* ============================================================
   9. 面板：检索迭代
   ============================================================ */
function paneRag(d) {
  const events = d.events || [];
  /* 直接从事件取，可带上事件本身的 task_id（后端 rag 聚合只回传 metadata） */
  const hops = events.filter(function (e) { return e.event_type === "multi_hop_iteration"; })
    .map(function (e) {
      return Object.assign({}, e.metadata || {}, { task_id: e.task_id || (e.metadata || {}).task_id });
    });
  const single = events.filter(function (e) { return e.event_type === "rag_iteration"; })
    .map(function (e) { return Object.assign({}, e.metadata || {}, { task_id: e.task_id }); });

  if (!hops.length && !single.length) {
    return '<div class="state"><div class="big">无检索迭代记录</div>本次运行没有 multi_hop_iteration / rag_iteration 事件</div>';
  }

  let html = "";
  if (hops.length) {
    html += '<div class="section-label">多跳检索迭代<small>每一跳记录探测到的盲区、改写后的查询与收敛决策</small></div>';
    html += '<div class="hops">' + hops.map(function (h, i) {
      const sufficient = h.is_sufficient === true || String(h.action).toUpperCase() === "STOP";
      const cls = sufficient ? "ok" : "run";
      const gl = sufficient ? "●" : "◐";
      const fields = [
        ["对应任务", h.task_id ? '<code>' + esc(h.task_id) + "</code>" : "—"],
        ["盲区探测", esc(h.gap || "—")],
        ["改写查询", h.next_query || h.query ? '<code>' + esc(h.next_query || h.query) + "</code>" : "—"],
        ["新增证据", h.new_evidence_count === undefined ? "—" : esc(String(h.new_evidence_count)) + " 条"],
        ["收敛判定", sufficient ? "已充分（SUFFICIENT）" : "继续下一跳（CONTINUE）"],
        ["执行动作", '<code>' + esc(h.action || "—") + "</code>"],
      ];
      if (h.stop_reason) fields.push(["停止原因", '<code>' + esc(h.stop_reason) + "</code>"]);

      return '<div class="hop">' +
        '<div class="hop-rail"><span class="hop-dot ' + cls + '">' + esc(gl) + "</span>" +
          (i < hops.length - 1 ? '<span class="hop-line"></span>' : "") +
        "</div>" +
        '<div class="hop-body">' +
          '<div class="hop-title"><strong>第 ' + esc(String(h.iteration === undefined ? i + 1 : h.iteration)) + " 跳</strong>" +
            '<span class="tag ' + cls + '"><span class="gl">' + esc(gl) + "</span>" +
            (sufficient ? "已收敛" : "继续检索") + "</span></div>" +
          '<dl class="hop-grid">' + fields.map(function (f) {
            return '<div class="hop-field"><dt>' + esc(f[0]) + "</dt><dd>" + f[1] + "</dd></div>";
          }).join("") + "</dl>" +
        "</div>" +
      "</div>";
    }).join("") + "</div>";
  }

  if (single.length) {
    html += '<div class="section-label" style="margin-top:18px">单轮召回<small>三通道各自的召回数量</small></div>' +
      '<div class="table-wrap"><table><thead><tr>' +
      "<th>#</th><th>学术</th><th>联网</th><th>本地</th><th>充分性</th><th>查询改写</th>" +
      "</tr></thead><tbody>" +
      single.map(function (r, i) {
        return "<tr><td>" + (i + 1) + "</td>" +
          '<td class="num">' + esc(r.academic === undefined ? "—" : r.academic) + "</td>" +
          '<td class="num">' + esc(r.web === undefined ? "—" : r.web) + "</td>" +
          '<td class="num">' + esc(r.local === undefined ? "—" : r.local) + "</td>" +
          "<td>" + (r.is_sufficient === undefined ? "—" : (r.is_sufficient ? "充分" : "不足")) + "</td>" +
          "<td>" + (r.query_rewrite ? esc(r.query_rewrite) : "—") + "</td></tr>";
      }).join("") + "</tbody></table></div>";
  }
  return html;
}

/* ============================================================
   10. 面板：证据溯源
   ============================================================ */
function paneEvidence(d) {
  const trace = d.trace || [];
  if (!trace.length) {
    return '<div class="state"><div class="big">无证据登记</div>本次运行没有 evidence_registered 事件</div>';
  }
  return '<div class="section-label">证据溯源链<small>审计事件摘要，原文以业务库为准</small></div>' +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th class="narrow">#</th><th>证据 ID</th><th>来源 ID</th><th>来源类型</th>' +
      '<th>核验状态</th><th>关联声明</th><th>归属任务</th>' +
    "</tr></thead><tbody>" +
    trace.map(function (t, i) {
      return "<tr>" +
        '<td class="narrow num">' + (i + 1) + "</td>" +
        '<td class="mono">' + esc(t.evidence_id || "—") + "</td>" +
        '<td class="mono">' + esc(t.source_id || "—") + "</td>" +
        "<td>" + esc(t.source_type || "—") + "</td>" +
        "<td>" + tagHtml(t.verification_status || "UNKNOWN") + "</td>" +
        '<td class="mono">' + esc(t.claim_id || "—") + "</td>" +
        '<td class="mono">' + esc(t.task_id || "—") + "</td>" +
      "</tr>";
    }).join("") + "</tbody></table></div>";
}

/* ============================================================
   11. 面板：事件流
   ============================================================ */
function paneEvents(d) {
  const events = d.events || [];
  if (!events.length) return '<div class="state"><div class="big">无事件</div>本次运行没有审计事件</div>';

  const nodes = Array.from(new Set(events.map(function (e) { return String(e.node || "(无节点)"); }))).sort();
  const types = Array.from(new Set(events.map(function (e) { return String(e.event_type || ""); }))).sort();

  const opts = function (arr, cur, all) {
    return '<option value="">' + all + "</option>" + arr.map(function (v) {
      return '<option value="' + esc(v) + '"' + (cur === v ? " selected" : "") + ">" + esc(v) + "</option>";
    }).join("");
  };

  /* 只给异常事件着色与打标，成功事件不重复占用视觉带宽 */
  const rows = filteredEvents(d).map(function (e) {
    const bad = String(e.status).toUpperCase() === "FAILED";
    const errText = e.error
      ? (typeof e.error === "object" ? (e.error.type || "") + " " + (e.error.message || "") : String(e.error))
      : "";
    return '<tr class="' + (bad ? "row-bad" : "") + '">' +
      '<td class="narrow mono">' + esc(fmtClock(e.timestamp)) + "</td>" +
      '<td class="narrow"><span class="nodedot" style="background:' + nodeColor(e.node) + '"></span>' +
        esc(e.node || "—") + "</td>" +
      '<td class="narrow mono">' + (bad ? '<span class="failmark">✕</span>' : "") + esc(e.event_type) + "</td>" +
      '<td class="narrow mono">' + esc(e.task_id || "—") + "</td>" +
      '<td class="num narrow">' + esc(e.duration_ms ? fmtDur(e.duration_ms) : "—") + "</td>" +
      "<td>" + (errText ? '<span class="errtxt">' + esc(truncate(errText, 70)) + "</span><br>" : "") +
        '<span style="color:var(--ink-2)">' + esc(truncate(metaSummary(e.metadata) || "—", 110)) + "</span>" +
      "</td>" +
    "</tr>";
  }).join("");

  const shown = filteredEvents(d).length;

  return '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:11px;align-items:center">' +
      '<input id="evt-kw" class="btn" style="width:200px;height:30px;text-align:left;font-weight:400" ' +
        'type="search" placeholder="搜索事件内容 / metadata" value="' + esc(state.evtFilter.kw) + '">' +
      '<select id="evt-node" class="btn">' + opts(nodes, state.evtFilter.node, "全部节点") + "</select>" +
      '<select id="evt-type" class="btn">' + opts(types, state.evtFilter.type, "全部事件类型") + "</select>" +
      '<button type="button" class="btn" id="evt-reset">重置筛选</button>' +
      '<span style="margin-left:auto;font-size:11.5px;color:var(--ink-3)" class="num">' +
        shown + " / " + events.length + " 条</span>" +
    "</div>" +
    '<div class="table-wrap"><table><thead><tr>' +
      '<th class="narrow">时刻</th><th class="narrow">节点</th><th class="narrow">事件类型</th>' +
      '<th class="narrow">任务</th><th class="narrow">耗时</th><th>摘要</th>' +
    "</tr></thead><tbody>" + (rows || '<tr><td colspan="6" style="padding:24px;text-align:center;color:var(--ink-3)">无匹配事件</td></tr>') +
    "</tbody></table></div>";
}

function filteredEvents(d) {
  const f = state.evtFilter;
  const kw = f.kw.trim().toLowerCase();
  return (d.events || []).filter(function (e) {
    if (f.node && String(e.node || "(无节点)") !== f.node) return false;
    if (f.type && String(e.event_type) !== f.type) return false;
    if (!kw) return true;
    const hay = [e.event_type, e.node, e.task_id, metaSummary(e.metadata),
                 typeof e.error === "object" ? JSON.stringify(e.error) : String(e.error || "")]
      .join(" ").toLowerCase();
    return hay.indexOf(kw) >= 0;
  });
}

function bindEvents(d) {
  const kw = document.getElementById("evt-kw");
  const nodeSel = document.getElementById("evt-node");
  const typeSel = document.getElementById("evt-type");
  const reset = document.getElementById("evt-reset");
  const host = document.getElementById("panes");
  if (!host) return;

  const rerender = function () {
    host.innerHTML = '<div class="pane on">' + paneEvents(d) + "</div>";
    bindEvents(d);
    const again = document.getElementById("evt-kw");
    if (again) { again.focus(); again.setSelectionRange(again.value.length, again.value.length); }
  };

  if (kw) kw.addEventListener("input", function () { state.evtFilter.kw = kw.value; rerender(); });
  if (nodeSel) nodeSel.addEventListener("change", function () { state.evtFilter.node = nodeSel.value; rerender(); });
  if (typeSel) typeSel.addEventListener("change", function () { state.evtFilter.type = typeSel.value; rerender(); });
  if (reset) reset.addEventListener("click", function () {
    state.evtFilter = { node: "", type: "", kw: "" };
    rerender();
  });
}

/* ============================================================
   12. 事件绑定与启动
   ============================================================ */
function bindGlobal() {
  const list = document.getElementById("run-list");
  if (list) {
    list.addEventListener("click", function (e) {
      const item = e.target.closest ? e.target.closest("[data-run]") : null;
      if (!item) return;
      const id = item.getAttribute("data-run");
      if (id && id !== state.currentId) selectRun(id);
    });
  }

  const filters = document.getElementById("quick-filters");
  if (filters) {
    filters.addEventListener("click", function (e) {
      const chip = e.target.closest ? e.target.closest("[data-quick]") : null;
      if (!chip) return;
      state.quick = chip.getAttribute("data-quick") || "";
      renderQuickFilters();
      renderRunList();
    });
  }

  const search = document.getElementById("q");
  if (search) {
    search.addEventListener("input", function () { state.keyword = search.value; renderRunList(); });
  }

  const sel = document.getElementById("status-filter");
  if (sel) {
    sel.addEventListener("change", function () {
      state.quick = sel.value;
      renderQuickFilters();
      renderRunList();
    });
  }

  const refresh = document.getElementById("btn-refresh");
  if (refresh) refresh.addEventListener("click", function () { loadRuns(); });

  window.addEventListener("hashchange", function () {
    const id = (location.hash || "").replace(/^#\/?/, "");
    if (id && id !== state.currentId) selectRun(id);
  });
}

document.addEventListener("DOMContentLoaded", function () {
  renderQuickFilters();
  bindGlobal();
  loadRuns();
});
</script>
